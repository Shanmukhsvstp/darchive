spring.application.name=darchive
server.port=${PORT:8080}
server.error.include-message=always

# Loads backend/.env automatically (KEY=value lines). Real env vars also work.
spring.config.import=optional:file:.env[.properties]

# ---- Neon (PostgreSQL) -------------------------------------------------
spring.datasource.url=${NEON_JDBC_URL}
spring.datasource.username=${NEON_DB_USER}
spring.datasource.password=${NEON_DB_PASSWORD}
# Small pool + tolerant timeouts: Neon scales to zero and the first query can be slow.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

# ---- Google OAuth2 -----------------------------------------------------
# The browser only ever talks to the FRONTEND origin (Next.js proxies /api and /oauth2 to this server),
# so Google must redirect back to the frontend URL.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${app.frontend-url}/login/oauth2/code/google
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true

# ---- Uploads (stored in Postgres) ----------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---- AI (Anthropic API) --------------------------------------------------
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}

# ---- App ---------------------------------------------------------------
# Public URL of the FRONTEND (no trailing slash)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:bmsce.ac.in}
# Comma-separated emails that are made admin automatically on login
app.admin-emails=${ADMIN_EMAILS:}
